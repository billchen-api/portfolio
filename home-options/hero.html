<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hero graphic</title>
<script>
/* Live hero graphic from a case page. Reads the case page at runtime, keeps only the hero visual,
   and runs the site's own CSS and main.js, so it always matches the case page.
   ?c=as|db|mk  &m=still (reduced motion final state, frozen) | play */
(()=>{window.REALTO=setTimeout.bind(window);const P=new URLSearchParams(location.search);window.HC=P.get('c');window.STILL=P.get('m')!=='play';
document.documentElement.classList.add('js');if(STILL)document.documentElement.classList.add('still');
window.RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* still: fast forward the real sequence (timers and clocks run 60x) to its settled end state, then freeze */
if(STILL&&!RM){const k=1/60,st=setTimeout.bind(window),si=setInterval.bind(window),pn=performance.now.bind(performance),t0=pn(),raf=requestAnimationFrame.bind(window);
 window.setTimeout=(f,d,...a)=>st(f,(+d||0)*k,...a);window.setInterval=(f,d,...a)=>si(f,Math.max(4,(+d||0)*k),...a);
 performance.now=()=>t0+(pn()-t0)/k;window.requestAnimationFrame=cb=>raf(()=>cb(performance.now()))}})();
</script>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
html,body{margin:0;overflow:hidden!important;height:100%}
.pt,nav,main,footer,.cm,.pn{display:none!important}
.hero .mk-h,.hero .mk-l,.hero .hb-facts,.hero .crumb{visibility:hidden!important}
.hero{min-height:100vh}
.hero .ae-h{display:none!important}
html.still.frozen *,html.still.frozen *::before,html.still.frozen *::after{animation-play-state:paused!important}
html.still *,html.still *::before,html.still *::after{transition:none!important}
</style>
</head><body>
<script>
(async()=>{const U={as:'../case-study-03.html',db:'../case-study-02.html',mk:'../case-study.html'}[HC];if(!U)return;
const doc=new DOMParser().parseFromString(await (await fetch(U,{cache:'no-cache'})).text(),'text/html');
document.body.className=doc.body.className;
const hero=doc.querySelector('header.hero');if(!hero)return;
hero.querySelectorAll('.mk-h h1,.hsub,.lede').forEach(e=>e.removeAttribute('id'));
document.body.prepend(document.adoptNode(hero));
/* page data scripts (for example the Assurance timeline epochs), never the site bootstrap */
for(const s of doc.querySelectorAll('script:not([src])')){const t=s.textContent;if(/window\.RM\s*=/.test(t))continue;const n=document.createElement('script');n.textContent=t;document.body.appendChild(n)}
document.querySelectorAll('.rv').forEach(e=>{if(STILL)e.classList.add('in')});
const m=document.createElement('script');m.src='../assets/js/main.js';
m.onload=()=>{
 const fin=()=>{const v=document.querySelector('.hero .hb-v');if(!v)return;
  if(STILL){document.documentElement.classList.add('frozen');document.querySelectorAll('svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations())}
  let r=v.getBoundingClientRect(),a=[r.left,r.top,r.right,r.bottom];
  [...v.children].filter(c=>c.getAttribute('aria-hidden')!=='true'&&getComputedStyle(c).display!=='none').forEach(c=>{const q=c.getBoundingClientRect();if(q.width&&q.height)a=[Math.min(a[0],q.left),Math.min(a[1],q.top),Math.max(a[2],q.right),Math.max(a[3],q.bottom)]});
  window.CROP={x:a[0],y:a[1],w:a[2]-a[0],h:a[3]-a[1]};document.documentElement.classList.add('ready');
  parent!==window&&parent.postMessage({hero:HC,mode:STILL?'still':'play',crop:window.CROP},location.origin)};
 (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>REALTO(fin,STILL&&!RM?450:60))};
document.body.appendChild(m)})();
</script>
</body></html>
